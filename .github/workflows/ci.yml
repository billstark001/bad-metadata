name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: Check formatting and version
        run: |
          go run ./scripts/tasks.go fmt-check
          go run ./scripts/tasks.go version-check
      - name: Verify module integrity
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s\n' "$PR_TITLE" | LC_ALL=C grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_. /-]+\))?!?: .+'; then
            echo 'PR titles must follow Conventional Commits.' >&2
            exit 1
          fi

  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            name: Windows
            goos: windows
          - runner: macos-latest
            name: macOS
            goos: darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CGO_ENABLED: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
          go run ./scripts/tasks.go race
      - name: Build and package both architectures
        run: go run ./scripts/tasks.go package "${{ matrix.goos }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.goos }}
          path: dist/
          if-no-files-found: error
