name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
      - name: Publish version and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < internal/version/VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Invalid release version.' >&2
            exit 1
          fi
          tag="v$version"
          mkdir -p dist
          for os in windows darwin; do
            cp "artifacts/release-$os/"*.zip dist/
            cat "artifacts/release-$os/SHA256SUMS" >> dist/SHA256SUMS
          done
          cp artifacts/release-windows/release-notes.md dist/release-notes.md
          sort -o dist/SHA256SUMS dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          for os in windows darwin; do
            for arch in amd64 arm64; do
              test -s "dist/bad-metadata-$tag-$os-$arch.zip"
            done
          done
          ref="refs/tags/$tag"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag" --jq ".[] | select(.ref == \"$ref\") | .object.sha")
          if [[ -z "$existing" ]]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="$ref" -f sha="$GITHUB_SHA" --silent
          elif [[ "$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)" != "$GITHUB_SHA" ]]; then
            echo "$tag already points to another commit." >&2
            exit 1
          fi
          gh release create "$tag" dist/*.zip dist/SHA256SUMS --verify-tag --title "$tag" --notes-file dist/release-notes.md
